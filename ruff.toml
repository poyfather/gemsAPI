# Lint config for backend/, tests/ and evals/. Run `ruff check .` from the repo root.
target-version = "py312"
line-length = 120
extend-exclude = ["frontend", "backend/.venv"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# sys.path and load_dotenv() have to run before the app imports in these entry points.
"backend/mcp_server.py" = ["E402"]
"tests/*.py" = ["E402"]
"evals/*.py" = ["E402"]
