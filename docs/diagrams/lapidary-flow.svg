<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">How Lapidary Answers</title><desc id="d">You ask from the web UI, the Windows console, Claude or ChatGPT over MCP, Cursor or Codex, Open WebUI, or a script. Lapidary builds the prompt, picks the AI, answers or acts with tools, checks the result with gates and tests, and keeps the run, the version and what it learned, then answers in the app you asked from.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3557d6"/></marker><marker id="arrowStart" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3557d6"/></marker><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1e3a8a" flood-opacity="0.10"/></filter></defs><rect width="1200" height="830" fill="#ffffff"/><text x="600" y="52" font-size="36" font-weight="800" fill="#14213d" text-anchor="middle">How Lapidary Answers</text>
<text x="600" y="84" font-size="18" font-weight="500" fill="#5b6577" text-anchor="middle">One prompt library, every app, the AI you choose</text>
