<text x="92" y="274" font-size="15.5" font-weight="800" fill="#14213d" text-anchor="start">1  Build the prompt</text>
<text x="60" y="302" font-size="13.5" font-weight="700" fill="#1d4ed8" text-anchor="start">Resolver</text>
<text x="60" y="330" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">pastes in the prompts</text>
<text x="60" y="351" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">it is built from</text>
<text x="60" y="372" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">fills blanks, defaults</text>
<text x="60" y="393" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">adds worked examples</text>
<text x="60" y="414" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">and memory</text>
