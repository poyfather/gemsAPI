<text x="773" y="274" font-size="15.5" font-weight="800" fill="#14213d" text-anchor="start">4  Check it</text>
<text x="741" y="302" font-size="13.5" font-weight="700" fill="#c2410c" text-anchor="start">Gates and tests</text>
<text x="741" y="330" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">tests, visual and</text>
<text x="741" y="351" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">adversarial review</text>
<text x="741" y="372" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">failures go back</text>
<text x="741" y="393" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">you accept the result</text>
