<text x="1000" y="274" font-size="15.5" font-weight="800" fill="#14213d" text-anchor="start">5  Keep it</text>
<text x="968" y="302" font-size="13.5" font-weight="700" fill="#1e7a37" text-anchor="start">History and memory</text>
<text x="968" y="330" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">every run recorded</text>
<text x="968" y="351" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">every save versioned</text>
<text x="968" y="372" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">lessons remembered</text>
<text x="968" y="393" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">for the next time</text>
