<text x="319" y="274" font-size="15.5" font-weight="800" fill="#14213d" text-anchor="start">2  Pick the AI</text>
<text x="287" y="302" font-size="13.5" font-weight="700" fill="#6d28d9" text-anchor="start">Which AI should we use?</text>
<text x="287" y="330" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">free one on this PC</text>
<text x="287" y="351" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">online with your key</text>
<text x="287" y="372" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">a mix, or decide for me</text>
<text x="287" y="393" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">and says why</text>
<path d="M481,354 L492,354" fill="none" stroke="#3557d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="494" y="236" width="212" height="236" rx="14" fill="#f5f9ff" stroke="#93b4f5" stroke-width="2" filter="url(#shadow)"/>
<circle cx="524" cy="268" r="20.4" fill="#ffffff"/>
<g transform="translate(512.0,256.0) scale(1.000)" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-14.3 4.9M4 12a8 8 0 0 1 14.3-4.9M18.5 3v4.5H14M5.5 21v-4.5H10"/></g>
<text x="546" y="274" font-size="15.5" font-weight="800" fill="#14213d" text-anchor="start">3  Answer or act</text>
<text x="514" y="302" font-size="13.5" font-weight="700" fill="#1d4ed8" text-anchor="start">Prompt or assistant</text>
<text x="514" y="330" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">a prompt answers once</text>
<text x="514" y="351" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">an assistant uses tools</text>
<text x="514" y="372" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">step by step and asks</text>
<text x="514" y="393" font-size="13.5" font-weight="400" fill="#344054" text-anchor="start">before risky ones</text>
<path d="M708,354 L719,354" fill="none" stroke="#3557d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="721" y="236" width="212" height="236" rx="14" fill="#fff5ea" stroke="#f08c2e" stroke-width="2" filter="url(#shadow)"/>
