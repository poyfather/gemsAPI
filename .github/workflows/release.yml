name: Release

# Pushing a tag like v0.1.0 creates a GitHub release whose notes are that
# version's section of CHANGELOG.md. Move the Unreleased items into a dated
# section and bump the version first (see CONTRIBUTING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract this version's notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; found = ($0 ~ "^## \\[" v "\\]"); next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No '## [$version]' section in CHANGELOG.md"; exit 1
          fi
          cat notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
