name: Desktop

# Builds the Lapidary Console installer for Windows: the backend as a PyInstaller
# single file, the UI as a Next.js standalone server, then electron-builder.
on:
  pull_request:
    paths: ["desktop/**", "backend/**", "frontend/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", "backend/**", "frontend/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  console-tests:
    name: Console logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm run lint && npm test
        working-directory: desktop

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    needs: console-tests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the backend as one file
        shell: pwsh
        run: |
          pip install -r backend/requirements.txt pyinstaller
          pyinstaller --onefile --name lapidary-backend --paths backend --collect-all fastmcp --collect-all mcp --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.lifespan.on backend/run.py
          New-Item -ItemType Directory -Force build/backend | Out-Null
          Copy-Item dist/lapidary-backend.exe build/backend/
      - name: Smoke test the backend exe
        shell: pwsh
        env:
          GEMS_API_KEY: ci-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder
        run: |
          $p = Start-Process -FilePath build/backend/lapidary-backend.exe -PassThru -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..60) { try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/health).StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep -Seconds 1 } }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "backend exe did not answer /health" }
          "backend exe answers /health"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build the UI as a standalone server
        shell: pwsh
        run: |
          cd frontend
          npm ci
          $env:NEXT_TELEMETRY_DISABLED = "1"
          npm run build
          New-Item -ItemType Directory -Force ../build/frontend | Out-Null
          Copy-Item -Recurse -Force .next/standalone/* ../build/frontend/
          New-Item -ItemType Directory -Force ../build/frontend/.next | Out-Null
          Copy-Item -Recurse -Force .next/static ../build/frontend/.next/
          Copy-Item -Recurse -Force public ../build/frontend/

      - name: Build the installer
        shell: pwsh
        run: |
          cd desktop
          npm ci
          npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: LapidaryConsole-Setup
          path: desktop/dist/*.exe
          if-no-files-found: error
