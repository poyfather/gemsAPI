name: Desktop

# Builds the Lapidary Console installer for Windows: the backend as a PyInstaller
# single file, the UI as a Next.js standalone server, Lapidary Helper (the
# install and update service), then electron-builder. The installer is signed
# when signing secrets exist (desktop/README.md, "Code signing"), installed on
# the runner to check the helper service, and, when the release workflow calls
# this one, attached to the release with its SHA-256 checksum.
on:
  pull_request:
    paths: ["desktop/**", "backend/**", "frontend/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", "backend/**", "frontend/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Attach the installer and its checksum to this release.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  console-tests:
    name: Console logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm run lint && npm test
        working-directory: desktop

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    needs: console-tests
    env:
      # Signing. Azure Artifact Signing (formerly Trusted Signing) when these are set:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      # ...or a .pfx code-signing certificate (base64) and its password:
      PFX_BASE64: ${{ secrets.WIN_CSC_LINK }}
      PFX_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # The certificate's full subject, for example "CN=Jane Doe, O=Jane Doe, L=Austin, S=Texas, C=US".
      # The helper refuses a console update not signed by exactly this subject.
      PUBLISHER_SUBJECT: ${{ vars.LAPIDARY_PUBLISHER_SUBJECT }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide how to sign
        shell: pwsh
        run: |
          $mode = "none"
          if ($env:AZURE_CLIENT_SECRET -and $env:SIGNING_ENDPOINT -and $env:SIGNING_ACCOUNT -and $env:SIGNING_PROFILE -and $env:PUBLISHER_SUBJECT) { $mode = "azure" }
          elseif ($env:PFX_BASE64 -and $env:PUBLISHER_SUBJECT) { $mode = "pfx" }
          "SIGN_MODE=$mode" >> $env:GITHUB_ENV
          if ($mode -eq "none") { "::notice::Unsigned build: Windows SmartScreen will warn on install. See desktop/README.md, Code signing." }
          else { "Signing with $mode as $env:PUBLISHER_SUBJECT" }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the backend as one file
        shell: pwsh
        run: |
          pip install -r backend/requirements.txt pyinstaller typer
          pyinstaller --onefile --name lapidary-backend --paths backend --add-data "supabase/schema.sql;supabase" --add-data "backend/app/storage/sqlite_schema.sql;app/storage" --collect-all fastmcp --collect-all mcp --collect-submodules uvicorn backend/run.py
          New-Item -ItemType Directory -Force build/backend | Out-Null
          Copy-Item dist/lapidary-backend.exe build/backend/
      - name: Smoke test the backend exe
        shell: pwsh
        env:
          GEMS_API_KEY: ci-placeholder
          GEMS_STORAGE: sqlite
          GEMS_SQLITE_PATH: ${{ runner.temp }}\lapidary-smoke.db
        run: |
          $out = "$env:RUNNER_TEMP\backend-out.log"; $err = "$env:RUNNER_TEMP\backend-err.log"
          $p = Start-Process -FilePath build/backend/lapidary-backend.exe -PassThru -WindowStyle Hidden -RedirectStandardOutput $out -RedirectStandardError $err
          $ok = $false
          foreach ($i in 1..60) {
            if ($p.HasExited) { break }
            try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/health).StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep -Seconds 1 }
          }
          if ($ok) { $gems = (Invoke-WebRequest -UseBasicParsing -Headers @{ "X-API-Key" = "ci-placeholder" } http://127.0.0.1:8000/gems/).Content | ConvertFrom-Json; "backend exe answers /health and lists $($gems.Count) seed gems" }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          "--- backend stdout ---"; Get-Content $out -ErrorAction SilentlyContinue
          "--- backend stderr ---"; Get-Content $err -ErrorAction SilentlyContinue
          if (-not $ok) { throw "backend exe did not answer /health (exit code $($p.ExitCode)); see the output above" }

      - name: Build Lapidary Helper
        shell: pwsh
        run: |
          pip install pywin32
          pyinstaller --onedir --noconfirm --name lapidary-helper --distpath build --workpath "$env:RUNNER_TEMP/pyi-helper" --specpath "$env:RUNNER_TEMP" --hidden-import win32timezone desktop/helper/lapidary_helper.py
          if (-not (Test-Path build/lapidary-helper/lapidary-helper.exe)) { throw "helper exe missing" }

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Write the helper's allowlist
        shell: pwsh
        run: |
          # Only a signed build pins the publisher; an unsigned one checks the published checksum only.
          $env:LAPIDARY_PUBLISHER = if ($env:SIGN_MODE -ne "none") { $env:PUBLISHER_SUBJECT } else { "" }
          node desktop/scripts/allowlist.mjs build/lapidary-helper/allowlist.json
      - name: Build the UI as a standalone server
        shell: pwsh
        run: |
          cd frontend
          npm ci
          $env:NEXT_TELEMETRY_DISABLED = "1"
          npm run build
          New-Item -ItemType Directory -Force ../build/frontend | Out-Null
          Copy-Item -Recurse -Force .next/standalone/* ../build/frontend/
          New-Item -ItemType Directory -Force ../build/frontend/.next | Out-Null
          Copy-Item -Recurse -Force .next/static ../build/frontend/.next/
          Copy-Item -Recurse -Force public ../build/frontend/

      - name: Build the installer
        shell: pwsh
        run: |
          cd desktop
          npm ci
          $extra = @()
          if ($env:SIGN_MODE -eq "azure") {
            $cn = [regex]::Match($env:PUBLISHER_SUBJECT, 'CN=([^,]+)').Groups[1].Value.Trim()
            $extra = @(
              "-c.win.azureSignOptions.publisherName=$cn",
              "-c.win.azureSignOptions.endpoint=$env:SIGNING_ENDPOINT",
              "-c.win.azureSignOptions.codeSigningAccountName=$env:SIGNING_ACCOUNT",
              "-c.win.azureSignOptions.certificateProfileName=$env:SIGNING_PROFILE"
            )
          } elseif ($env:SIGN_MODE -eq "pfx") {
            $env:WIN_CSC_LINK = $env:PFX_BASE64
            $env:WIN_CSC_KEY_PASSWORD = $env:PFX_PASSWORD
          } else {
            $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          }
          npx electron-builder --win --x64 @extra
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii -NoNewline "$($_.FullName).sha256"
            "$($_.Name)  $hash"
          }

      - name: Check signatures
        if: env.SIGN_MODE != 'none'
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/dist/LapidaryConsole-Setup-*.exe | Select-Object -First 1
          $s = Get-AuthenticodeSignature $setup.FullName
          "$($s.Status): $($s.SignerCertificate.Subject)"
          if ($s.Status -ne "Valid") { throw "the installer is not validly signed" }

      - name: Install it and check the helper service
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/dist/LapidaryConsole-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $helperDir = "$env:ProgramFiles\Lapidary Console\resources\helper"
          function Show-Diagnostics {
            "--- sc query / qc ---"; sc.exe query LapidaryHelper; sc.exe qc LapidaryHelper
            "--- helper folder ---"; Get-ChildItem $helperDir -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table | Out-String
            "--- helper.log ---"; Get-Content "$helperDir\helper.log" -ErrorAction SilentlyContinue
            "--- service control manager events ---"
            Get-WinEvent -FilterHashtable @{ LogName = "System"; ProviderName = "Service Control Manager"; StartTime = (Get-Date).AddMinutes(-15) } -ErrorAction SilentlyContinue | Select-Object -First 15 TimeCreated, Id, Message | Format-List | Out-String
            "--- application errors ---"
            Get-WinEvent -FilterHashtable @{ LogName = "Application"; Level = 2; StartTime = (Get-Date).AddMinutes(-15) } -ErrorAction SilentlyContinue | Select-Object -First 10 TimeCreated, ProviderName, Message | Format-List | Out-String
            "--- running it in the console (debug) for 15 seconds ---"
            $p = Start-Process -FilePath "$helperDir\lapidary-helper.exe" -ArgumentList "debug" -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\helper-out.log" -RedirectStandardError "$env:RUNNER_TEMP\helper-err.log"
            Start-Sleep 15; if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Get-Content "$env:RUNNER_TEMP\helper-out.log", "$env:RUNNER_TEMP\helper-err.log" -ErrorAction SilentlyContinue
          }
          $svc = $null
          foreach ($i in 1..90) { $svc = Get-Service LapidaryHelper -ErrorAction SilentlyContinue; if ($svc.Status -eq "Running") { break }; Start-Sleep 1 }
          if (-not $svc -or $svc.Status -ne "Running") {
            "--- sc start ---"; sc.exe start LapidaryHelper; Start-Sleep 5
            Show-Diagnostics
            throw "Lapidary Helper is not running after install (status: $($svc.Status))"
          }
          $cfg = Get-CimInstance Win32_Service -Filter "Name='LapidaryHelper'"
          "service: $($cfg.State), start $($cfg.StartMode), runs as $($cfg.StartName), $($cfg.PathName)"
          if ($cfg.StartName -ne "LocalSystem" -or $cfg.StartMode -ne "Auto") { throw "unexpected service configuration" }
          $sd = (sc.exe sdshow LapidaryHelper) -join ""
          "access list: $sd"
          if ($sd -notmatch "\(A;;CCLCSWRPLOCRRC;;;IU\)") { throw "signed-in users cannot start the helper" }

          function Ask($json) {
            $c = New-Object System.IO.Pipes.NamedPipeClientStream(".", "LapidaryHelper", [System.IO.Pipes.PipeDirection]::InOut)
            $c.Connect(10000)
            $w = New-Object System.IO.StreamWriter($c); $w.AutoFlush = $true
            $r = New-Object System.IO.StreamReader($c)
            $w.Write($json + "`n")
            while ($null -ne ($line = $r.ReadLine())) { $m = $line | ConvertFrom-Json; if ($m.done) { $c.Dispose(); return $m }; "  $($m.line)" | Out-Host }
            $c.Dispose(); throw "the helper closed without an answer"
          }
          $ping = Ask '{"op":"ping"}'
          "ping: $($ping.message) ($($ping.version))"
          if (-not $ping.ok) { throw "ping failed" }
          $evil = Ask '{"op":"install","id":"not-on-the-list"}'
          "refused as expected: $($evil.message)"
          if ($evil.ok) { throw "the helper accepted an id that is not on its allowlist" }
          $cmd = Ask '{"op":"run","cmd":"calc.exe"}'
          if ($cmd.ok) { throw "the helper accepted an unknown op" }
          "helper log:"; Get-Content "$env:ProgramFiles\Lapidary Console\resources\helper\helper.log"

      - name: Install an allowlisted tool through the helper (informational)
        continue-on-error: true
        shell: pwsh
        run: |
          $c = New-Object System.IO.Pipes.NamedPipeClientStream(".", "LapidaryHelper", [System.IO.Pipes.PipeDirection]::InOut)
          $c.Connect(10000)
          $w = New-Object System.IO.StreamWriter($c); $w.AutoFlush = $true
          $r = New-Object System.IO.StreamReader($c)
          $w.Write('{"op":"install","id":"7zip"}' + "`n")
          while ($null -ne ($line = $r.ReadLine())) { $line; if (($line | ConvertFrom-Json).done) { break } }
          $c.Dispose()

      - name: Uninstall and check the helper is gone
        shell: pwsh
        run: |
          $un = Get-ChildItem "$env:ProgramFiles\Lapidary Console\Uninstall*.exe" | Select-Object -First 1
          Start-Process -FilePath $un.FullName -ArgumentList "/S" -Wait
          # sc.exe closes its handle each time; a service marked for deletion goes once no handle is open.
          $key = "HKLM:\SYSTEM\CurrentControlSet\Services\LapidaryHelper"
          $state = "registered"
          foreach ($i in 1..60) {
            sc.exe query LapidaryHelper *> $null
            if ($LASTEXITCODE -eq 1060) { $state = "removed"; break }
            if ((Get-ItemProperty $key -ErrorAction SilentlyContinue).DeleteFlag -eq 1) { $state = "marked for deletion" }
            Start-Sleep 1
          }
          "helper: $state"
          if ($state -eq "registered") { sc.exe query LapidaryHelper; sc.exe qc LapidaryHelper; throw "the uninstaller left Lapidary Helper registered" }
          if (Test-Path "$env:ProgramFiles\Lapidary Console\resources\helper\lapidary-helper.exe") { throw "the uninstaller left the helper's files" }
          "uninstalled"

      - uses: actions/upload-artifact@v4
        with:
          name: LapidaryConsole-Setup
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.sha256
          if-no-files-found: error

  release-assets:
    name: Attach to the release
    if: inputs.release_tag
    needs: windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LapidaryConsole-Setup
          path: dist
      - name: Upload the installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/*.exe dist/*.exe.sha256 --clobber --repo "${{ github.repository }}"
