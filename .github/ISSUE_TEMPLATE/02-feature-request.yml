name: Feature request
description: Suggest a new capability for the API, MCP server or UI
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? A new endpoint, an MCP tool, a UI change, a schema change?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where it belongs
      multiple: true
      options:
        - REST API
        - MCP tools or resources
        - Web UI
        - Gem syntax or resolution
        - Supabase schema
        - Deployment or Docker
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: roadmap
    attributes:
      label: Roadmap
      options:
        - label: I checked docs/ROADMAP.md and this is not already planned
