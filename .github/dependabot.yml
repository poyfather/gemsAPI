version: 2
updates:
  # Python: one entry at the repo root covers backend/requirements.txt and the
  # root requirements.txt (Dependabot scans both from "/"). One grouped PR a month.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "backend"]
    groups:
      python:
        patterns: ["*"]

  # Next.js frontend. Minor and patch updates arrive as one grouped PR a month.
  # Major versions of the framework and its toolchain (ESLint 10, TypeScript 7,
  # lucide 1.x, the next Next.js or Tailwind major) are migrations, not
  # updates; they are done on purpose and ignored here.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "frontend"]
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Lapidary Console (Electron). Minor and patch updates as one grouped PR a month.
  # Electron majors are migrations (43 deprecates safeStorage, which holds the keys).
  # rea-agents is pinned on purpose: 6.5 and later add frida, a 99 MB native
  # instrumentation toolkit, to the installer, so it is upgraded by hand.
  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "desktop"]
    groups:
      desktop:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rea-agents"

  # Base images. The frontend image tracks the current Node LTS line, so skip
  # odd-numbered (non-LTS) majors; Python minors are fine.
  - package-ecosystem: "docker"
    directories: ["/backend", "/frontend"]
    schedule:
      interval: "monthly"
    labels: ["dependencies", "docker"]
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Actions used by the workflows, grouped into one PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]
